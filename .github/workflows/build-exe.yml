name: build-exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, к которому прикрепить .exe (например, v2.1.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows-exe:
    name: Windows x64 .exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build one-file exe
        run: python build_exe.py

      - name: Show result
        shell: pwsh
        run: Get-Item dist\rename_for_plex.exe | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rename_for_plex-windows-x64
          path: dist/rename_for_plex.exe
          if-no-files-found: error

      # Тело релиза задаётся явно: generate_release_notes при повторном пуше
      # тега дописывает заметки к уже существующему описанию, из-за чего
      # строки дублируются.
      - name: Attach exe to release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rename_for_plex.exe
          body: |
            **rename_for_plex.exe** — готовый файл для Windows x64, Python не требуется.

            - Скачайте `rename_for_plex.exe` в разделе **Assets** ниже.
            - Двойной клик — мастер спросит папку и режим.
            - Из консоли: `rename_for_plex.exe "D:\Serials" --dry-run`

            Описание, флаги и сборка из исходников — в [README](https://github.com/${{ github.repository }}/blob/main/README.md).

            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}

      - name: Attach exe to release (manual run)
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/rename_for_plex.exe

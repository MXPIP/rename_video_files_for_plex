name: build-exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, к которому прикрепить .exe (например, v2.1.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows-exe:
    name: Windows x64 .exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build one-file exe
        run: python build_exe.py

      - name: Show result
        shell: pwsh
        run: Get-Item dist\rename_for_plex.exe | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rename_for_plex-windows-x64
          path: dist/rename_for_plex.exe
          if-no-files-found: error

      - name: Attach exe to release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rename_for_plex.exe
          generate_release_notes: true

      - name: Attach exe to release (manual run)
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/rename_for_plex.exe
